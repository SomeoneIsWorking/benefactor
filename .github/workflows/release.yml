name: Release artifacts

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BENEFACTOR_LUCENT_DIR: ${{ github.workspace }}/dependencies/lucent

jobs:
  windows:
    name: Windows package
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 9a91e6940106bde7f5d95275c7707818b763cb6e
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned SDL3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: libsdl-org/SDL
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 79e3ee8b7a9d4e989be1610ebe42e9c7fe507a23
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
      - name: Provision matching MinGW zlib
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\pacman.exe' -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib
          "CC=C:\msys64\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV
          "CXX=C:\msys64\mingw64\bin\g++.exe" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=C:\msys64\mingw64" >> $env:GITHUB_ENV
      - name: Build Windows package
        run: uv run --frozen python -m tools.build_desktop --platform windows --output build/release/Benefactor-windows-x86_64.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-windows-x86_64
          path: build/release/Benefactor-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-14
    timeout-minutes: 30
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 9a91e6940106bde7f5d95275c7707818b763cb6e
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned SDL3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: libsdl-org/SDL
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 79e3ee8b7a9d4e989be1610ebe42e9c7fe507a23
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
      - name: Build macOS app bundle
        run: uv run --frozen python -m tools.build_desktop --platform macos --output build/release/Benefactor.app
      - name: Upload macOS app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-macos-arm64
          path: build/release/Benefactor.app
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 9a91e6940106bde7f5d95275c7707818b763cb6e
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned SDL3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: libsdl-org/SDL
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 79e3ee8b7a9d4e989be1610ebe42e9c7fe507a23
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.12
        with:
          version: "0.10.12"
      - name: Install SDL3 Linux build dependencies
        run: |
          # The hosted runner ships a google-chrome apt source whose Packages
          # index intermittently fails its hash check and aborts apt-get; it is
          # unrelated to the packages we need.
          grep -rlZ 'dl.google.com/linux/chrome' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0r rm -f
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxss-dev libwayland-dev \
            libwayland-egl1-mesa libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libudev-dev libvulkan-dev libxtst-dev
      - name: Download pinned appimagetool
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build Linux AppImage
        run: >-
          uv run --frozen python -m tools.build_appimage
          --appimagetool "${{ runner.temp }}/appimagetool"
          --output build/release/Benefactor-x86_64.AppImage
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-linux-x86_64
          path: build/release/Benefactor-x86_64.AppImage
          if-no-files-found: error

  android:
    name: Android arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_ANDROID_PORT_DIR: ${{ github.workspace }}/shared/android-port
      BENEFACTOR_ANDROID_EPHEMERAL_SIGNING: "1"
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 9a91e6940106bde7f5d95275c7707818b763cb6e
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned Android build owner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/android-port
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: fa8b8f67bb446783b4aeea1def40c5d67040b7f1
          path: shared/android-port
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 79e3ee8b7a9d4e989be1610ebe42e9c7fe507a23
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up JDK 26
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "26"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.12
        with:
          version: "0.10.12"
      - name: Build Android APK
        run: uv run --frozen python -m tools.build_android --release
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-android-arm64-v8a
          path: build/android/Benefactor-arm64-v8a-release.apk
          if-no-files-found: error

  wasm:
    name: WASM browser package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 9a91e6940106bde7f5d95275c7707818b763cb6e
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned SDL3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: libsdl-org/SDL
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 79e3ee8b7a9d4e989be1610ebe42e9c7fe507a23
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.12
        with:
          version: "0.10.12"
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.9
      - name: Build WASM package
        run: uv run --frozen python -m tools.build_wasm --output build/release/web
      - name: Upload WASM package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-wasm
          path: build/release/web
          if-no-files-found: error
