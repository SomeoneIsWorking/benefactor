name: Release artifacts

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      verify_release_signing:
        description: Verify the published Android signer without creating a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

env:
  BENEFACTOR_LUCENT_DIR: ${{ github.workspace }}/dependencies/lucent

jobs:
  windows:
    name: Windows package
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 8050b197e14e9e4c583d255c80d958d8c859b4fa
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned SDL3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: libsdl-org/SDL
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 93275f46cd9e1efe25d21928bc575cf37de190d5
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
      - name: Provision matching MinGW zlib
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\pacman.exe' -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib
          "CC=C:\msys64\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV
          "CXX=C:\msys64\mingw64\bin\g++.exe" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=C:\msys64\mingw64" >> $env:GITHUB_ENV
      - name: Build Windows package
        run: uv run --frozen python -m tools.build_desktop --platform windows --output build/release/Benefactor-windows-x86_64.zip
      - name: Verify Windows runtime imports
        run: uv run --frozen python -m tools.check_windows_imports --objdump C:/msys64/mingw64/bin/objdump.exe build/windows/install/bin/benefactor-pc.exe
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-windows-x86_64
          path: build/release/Benefactor-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-14
    timeout-minutes: 30
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 8050b197e14e9e4c583d255c80d958d8c859b4fa
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned SDL3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: libsdl-org/SDL
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 93275f46cd9e1efe25d21928bc575cf37de190d5
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
      - name: Build macOS app bundle
        run: uv run --frozen python -m tools.build_desktop --platform macos --output build/release/Benefactor-macos-arm64.zip
      - name: Upload macOS app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-macos-arm64
          path: build/release/Benefactor-macos-arm64.zip
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 8050b197e14e9e4c583d255c80d958d8c859b4fa
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned SDL3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: libsdl-org/SDL
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 93275f46cd9e1efe25d21928bc575cf37de190d5
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.12
        with:
          version: "0.10.12"
      - name: Install SDL3 Linux build dependencies
        run: |
          # The hosted runner ships a google-chrome apt source whose Packages
          # index intermittently fails its hash check and aborts apt-get; it is
          # unrelated to the packages we need.
          grep -rlZ 'dl.google.com/linux/chrome' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0r rm -f
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxss-dev libwayland-dev \
            libwayland-egl1-mesa libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libudev-dev libvulkan-dev libxtst-dev
      - name: Download pinned appimagetool
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Build Linux AppImage
        run: >-
          uv run --frozen python -m tools.build_appimage
          --appimagetool "${{ runner.temp }}/appimagetool"
          --output build/release/Benefactor-x86_64.AppImage
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-linux-x86_64
          path: build/release/Benefactor-x86_64.AppImage
          if-no-files-found: error

  android:
    name: Android arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_ANDROID_PORT_DIR: ${{ github.workspace }}/shared/android-port
      BENEFACTOR_ANDROID_EPHEMERAL_SIGNING: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_release_signing) && '0' || '1' }}
      BENEFACTOR_ANDROID_KEYSTORE_B64: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_release_signing) && secrets.BENEFACTOR_ANDROID_KEYSTORE_B64 || '' }}
      BENEFACTOR_ANDROID_KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_release_signing) && secrets.BENEFACTOR_ANDROID_KEY_ALIAS || '' }}
      BENEFACTOR_ANDROID_STORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_release_signing) && secrets.BENEFACTOR_ANDROID_STORE_PASSWORD || '' }}
      BENEFACTOR_ANDROID_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.verify_release_signing) && secrets.BENEFACTOR_ANDROID_KEY_PASSWORD || '' }}
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 8050b197e14e9e4c583d255c80d958d8c859b4fa
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned Android build owner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/android-port
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 9d6d96f57fe2add688f3efd4ee76c072edc342c2
          path: shared/android-port
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 93275f46cd9e1efe25d21928bc575cf37de190d5
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up JDK 26
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "26"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.12
        with:
          version: "0.10.12"
      - name: Build Android APK
        run: uv run --frozen python -m tools.build_android --release
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-android-arm64-v8a
          path: build/android/Benefactor-arm64-v8a-release.apk
          if-no-files-found: error

  wasm:
    name: WASM browser package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 8050b197e14e9e4c583d255c80d958d8c859b4fa
          path: shared/amigaport
          submodules: recursive
          persist-credentials: false
      - name: Check out pinned SDL3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: libsdl-org/SDL
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Check out pinned Lucent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: SomeoneIsWorking/lucent
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: 93275f46cd9e1efe25d21928bc575cf37de190d5
          path: dependencies/lucent
          persist-credentials: false
      - name: Set up Python and uv
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.12
        with:
          version: "0.10.12"
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.9
      - name: Build WASM package
        run: uv run --frozen python -m tools.build_wasm --output build/release/web
      - name: Upload WASM package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Benefactor-wasm
          path: build/release/web
          if-no-files-found: error

  publish:
    name: Publish qualified native release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, android, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source and qualification evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Benefactor-*
          merge-multiple: true
          path: build/release/downloaded
      - name: Set up locked Python tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.12
        with:
          version: "0.10.12"
      - name: Verify qualification, inspect assets, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --frozen python -m tools.publish_release
          --tag "${{ github.ref_name }}"
          --artifacts build/release/downloaded
