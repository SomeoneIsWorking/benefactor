name: Asset-free source policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-policy:
    name: Source policy (runtime boundary pending)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.12'
      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang clang-format clang-tidy
      - name: Run retained-source verifier
        run: uv run --frozen python -m tools.verify
