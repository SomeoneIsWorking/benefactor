name: Asset-free source policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-policy:
    name: Asset-free source and runtime policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang
      CXX: clang++
      BENEFACTOR_AMIGAPORT_DIR: ${{ github.workspace }}/shared/amigaport
      BENEFACTOR_SDL3_DIR: ${{ github.workspace }}/dependencies/SDL3
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned shared runtime headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SomeoneIsWorking/amigaport
          token: ${{ secrets.SHARED_REPO_TOKEN || github.token }}
          ref: e9fe2251ff060ad65f6fb6bf7d1f9f5b56806c56
          path: shared/amigaport
          persist-credentials: false
      - name: Check out pinned SDL3 headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: libsdl-org/SDL
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: dependencies/SDL3
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.12'
      - name: Install native verification tools
        run: |
          # The hosted runner ships a google-chrome apt source whose Packages
          # index intermittently fails its hash check and aborts apt-get; it is
          # unrelated to the packages we need.
          grep -rlZ 'dl.google.com/linux/chrome' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0r rm -f
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang clang-tidy
      - name: Run retained-source verifier
        run: uv run --frozen python -m tools.verify
