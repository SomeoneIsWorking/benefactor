plugins { id 'com.android.application' }

def signingValues = [System.getenv('BENEFACTOR_ANDROID_KEYSTORE'),
                     System.getenv('BENEFACTOR_ANDROID_KEY_ALIAS'),
                     System.getenv('BENEFACTOR_ANDROID_STORE_PASSWORD'),
                     System.getenv('BENEFACTOR_ANDROID_KEY_PASSWORD')]
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } &&
        signingValues.any { !it }) {
    throw new GradleException('Release signing requires all BENEFACTOR_ANDROID_KEY_* and password variables.')
}

// The product version, from the repository's single source of truth. The source
// tree has version.txt beside it; build_android.py, which assembles this project
// into a build directory, passes the same number through the environment. The
// release tag is checked against version.txt before publication.
def benefactorVersionFile = new File(rootDir, '../../version.txt')
def benefactorVersion = benefactorVersionFile.isFile()
        ? benefactorVersionFile.text.trim()
        : System.getenv('BENEFACTOR_ANDROID_VERSION_NAME')
if (benefactorVersion == null || !(benefactorVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("the product version must be MAJOR.MINOR.PATCH: " +
            "version.txt is missing and BENEFACTOR_ANDROID_VERSION_NAME is '${benefactorVersion}'")
}
def benefactorVersionParts = benefactorVersion.tokenize('.').collect { it.toInteger() }
def benefactorVersionCode = benefactorVersionParts[0] * 10000 +
        benefactorVersionParts[1] * 100 + benefactorVersionParts[2]

android {
    namespace = 'io.github.someoneisworking.benefactor'
    compileSdk = 35
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'io.github.someoneisworking.benefactor'
        minSdk = 21
        targetSdk = 35
        versionCode = (System.getenv('BENEFACTOR_ANDROID_VERSION_CODE') ?: benefactorVersionCode).toInteger()
        versionName = benefactorVersion
    }
    signingConfigs {
        release {
            if (signingValues.every { it }) {
                storeFile = file(signingValues[0])
                keyAlias = signingValues[1]
                storePassword = signingValues[2]
                keyPassword = signingValues[3]
                v1SigningEnabled = true
                v2SigningEnabled = true
                enableV3Signing = true
            }
        }
    }
    buildTypes {
        debug { debuggable = true }
        release { minifyEnabled = false; signingConfig = signingConfigs.release }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
