<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benefactor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0b0f18;
        color: #e6ecf5;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
      }
      /* Preserve the authored Amiga pixels when the canvas is enlarged on a
         HiDPI display. SDL's desktop backend applies the equivalent texture
         policy at the renderer boundary. */
      #canvas {
        width: 100%;
        height: auto;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }
      /* The setup screen is drawn inside the canvas, so this line only reports
         what the canvas cannot: a failed picker, a missing WebGL context, or a
         rejected disk set. */
      #disk-status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Benefactor</h1>
      <canvas id="canvas" aria-label="Benefactor game and setup screen"></canvas>
      <p id="disk-status"></p>
    </main>
    <script type="module">
      import { prepareApplication } from "./isolation.mjs";

      async function loadApplication() {
        const status = document.getElementById("disk-status");
        try {
          if (!await prepareApplication()) {
            return;
          }
          // The picker bridge installs the hooks the product calls; the product
          // then draws its own setup screen into the canvas.
          const picker = document.createElement("script");
          picker.src = "disk_setup.js";
          picker.onload = () => {
            const runtime = document.createElement("script");
            runtime.src = "benefactor.js";
            document.body.appendChild(runtime);
          };
          picker.onerror = () => {
            status.textContent = "The browser could not load the disk picker.";
          };
          document.body.appendChild(picker);
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "Browser setup failed";
        }
      }

      loadApplication();
    </script>
  </body>
</html>
