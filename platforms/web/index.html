<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benefactor</title>
    <style>
      /* Preserve the authored Amiga pixels when the canvas is enlarged on a
         HiDPI display. SDL's desktop backend applies the equivalent texture
         policy at the renderer boundary. */
      #benefactor-canvas {
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Benefactor</h1>
      <p id="disk-status">Select your original Disk.1, Disk.2, and Disk.3 files, or one ZIP containing them, to continue.</p>
      <label for="disk-files">Browse for disks</label>
      <!-- Disk images use numeric suffixes rather than usual media extensions.
           Keep the chooser unrestricted because some browser file dialogs do
           not treat numeric suffixes as selectable media types. The JavaScript
           validator still checks exact names, sizes, and hashes. -->
      <input id="disk-files" type="file" multiple>
      <canvas id="benefactor-canvas" aria-label="Benefactor game"></canvas>
    </main>
    <script src="disk_setup.js"></script>
    <script src="benefactor.js"></script>
  </body>
</html>
